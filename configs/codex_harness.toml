# native-v1 is preferred because it uses Codex spawn_agent with the project custom agents.
# If the local Codex build still cannot prove a Luna spawn, the harness falls back to
# separate process-isolated Sol/Luna/Sol worker sessions with explicit model flags.
backend = "native-v1"
allow_process_fallback = true
require_luna_evidence = true
max_review_loops = 2

[models]
planner = "gpt-5.6-sol"
planner_effort = "medium"
implementer = "gpt-5.6-luna"
implementer_effort = "max"
reviewer = "gpt-5.6-sol"
reviewer_effort = "medium"
