[project]
name = "florent-code-league-bot"
version = "0.1.0"
description = "Florent Code League bot development and evaluation harness"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fcode>=2.3.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []
