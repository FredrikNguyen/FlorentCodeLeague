[project]
name = "florent-code-league-bot"
version = "0.1.0"
description = "Karrigan, a deterministic Florent Code League competition bot"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fcode>=2.3.4",
]

[dependency-groups]
dev = [
    "ruff==0.16.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Ruff's formatter intentionally does not enforce line length. Keep long command
# and generated-Markdown strings readable while enforcing semantic lint rules.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These branches mirror the game decision tree and are clearer when kept explicit.
"bots/**/*.py" = ["SIM102", "SIM103", "SIM110"]
